<!doctype html>
<!-- Source of web/buy/card.png, the X player card preview (1200x1200). X draws its play button in the middle,
     so the centre stays clear. Regenerate: ./tools/make-buy-card.sh -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>$COMPANY buy card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 1200px; overflow: hidden; }
body {
  font-family: "Instrument Sans", Helvetica, Arial, sans-serif; color: #fff; position: relative;
  background:
    radial-gradient(55% 45% at 92% 8%, #7a3f2c, transparent 70%),
    radial-gradient(60% 50% at 6% 100%, #2a2350, transparent 72%),
    radial-gradient(70% 60% at 30% 12%, #1d2f5e, transparent 72%),
    #0b1530;
}
.wrap { position: absolute; inset: 0; padding: 84px 88px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 20px; font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.brand img { width: 72px; height: 72px; border-radius: 16px; background: #111; }
h1 { margin-top: 64px; font-size: 118px; line-height: .98; font-weight: 500; letter-spacing: -0.035em; }
h1 span { color: rgba(255,255,255,.62); }
.mid { flex: 1; }
.lead { font-size: 38px; line-height: 1.3; color: rgba(255,255,255,.86); max-width: 24ch; }
.lead b { color: #fff; font-weight: 600; }
.chips { display: flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 12px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
.chip i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 18px; }
.foot { margin-top: 48px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: rgba(255,255,255,.75); }
.foot b { color: #fff; font-weight: 600; }
.pill { padding: 10px 18px; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 22px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="../web/logo.svg" alt="" />The Zero Person Billion Dollar Company</div>
  <h1>Buy $COMPANY<br /><span>without leaving<br />this post.</span></h1>
  <div class="mid"></div>
  <p class="lead">Hold 100,000+ and earn <b>3% of every trade</b>, paid in IMD and stocks.</p>
  <div class="chips">
    <span class="chip"><i style="background:#ecebe7;color:#111">I</i>IMD</span>
    <span class="chip"><i style="background:#4f7a12">N</i>NVDA</span>
    <span class="chip"><i style="background:#2f5fb3">G</i>GOOGL</span>
    <span class="chip"><i style="background:#3d3d3f">A</i>AAPL</span>
    <span class="chip"><i style="background:#a8282e">G</i>GME</span>
    <span class="chip"><i style="background:#c46a12">M</i>MSTR</span>
  </div>
  <div class="foot"><span><b>zeropersoncompany.fun</b> · Robinhood Chain</span><span class="pill">Press play</span></div>
</div>
</body>
</html>
